<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ermand's Brew Arsenal — Dev Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e8ea;
    --muted: #6b6b72;
    --accent: #a78bfa;
    --accent2: #34d399;
    --accent3: #fb923c;
    --accent4: #38bdf8;
    --accent5: #f472b6;

    --cat-shell: #34d399;
    --cat-cli: #a78bfa;
    --cat-git: #fb923c;
    --cat-devops: #38bdf8;
    --cat-runtime: #f472b6;
    --cat-nodejs: #34d399;
    --cat-python: #facc15;
    --cat-database: #38bdf8;
    --cat-security: #fb7185;
    --cat-network: #38bdf8;
    --cat-media: #fb923c;
    --cat-graphics: #f472b6;
    --cat-fonts: #6b6b72;
    --cat-build: #facc15;
    --cat-devlib: #6b6b72;
    --cat-devtools: #a78bfa;
    --cat-api: #34d399;
    --cat-ai: #c084fc;
    --cat-ios: #38bdf8;
    --cat-android: #34d399;
    --cat-macos: #fb923c;
    --cat-terminal: #a78bfa;
    --cat-pdf: #6b6b72;
    --cat-math: #6b6b72;
    --cat-crypto: #facc15;
    --cat-compress: #6b6b72;
    --cat-system: #6b6b72;
    --cat-editor: #c084fc;
    --cat-testing: #34d399;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Subtle grid texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .page { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 2rem 4rem; }

  /* Header */
  header {
    padding: 3.5rem 0 2.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .header-title h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text);
  }

  .header-title h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .header-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 0.5rem;
    font-family: 'DM Mono', monospace;
  }

  .header-stats {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .stat {
    text-align: right;
  }

  .stat-num {
    display: block;
    font-family: 'Instrument Serif', serif;
    font-size: 2rem;
    line-height: 1;
    color: var(--text);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'DM Mono', monospace;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 340px;
  }

  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--muted);
  }

  input[type=text] {
    width: 100%;
    padding: 8px 12px 8px 32px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type=text]:focus { border-color: var(--accent); }
  input[type=text]::placeholder { color: var(--muted); }

  .view-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    overflow: hidden;
  }

  .view-btn {
    padding: 8px 12px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .view-btn.active { background: var(--surface2); color: var(--text); }

  .results-count {
    margin-left: auto;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    align-self: center;
  }

  /* Category filters */
  .cat-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .cat-btn {
    padding: 4px 11px;
    border-radius: 99px;
    border: 1px solid var(--border2);
    background: none;
    color: var(--muted);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .cat-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
  .cat-btn.active { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.25); color: var(--text); }

  /* Grid view */
  .pkg-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .pkg-card {
    background: var(--surface);
    padding: 14px 16px;
    transition: background 0.12s;
    position: relative;
  }

  .pkg-card:hover { background: var(--surface2); }

  .pkg-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .pkg-name {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    transition: color 0.12s;
    word-break: break-all;
    line-height: 1.3;
  }

  .pkg-name:hover { color: var(--accent); }

  .pkg-link {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    transition: all 0.12s;
    font-size: 11px;
    margin-top: 1px;
  }

  .pkg-link:hover { background: rgba(167,139,250,0.15); border-color: var(--accent); color: var(--accent); }

  .pkg-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .pkg-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .cat-tag {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid;
    opacity: 0.85;
    white-space: nowrap;
  }

  .type-badge {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    padding: 2px 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
  }

  /* List view */
  .pkg-list { display: none; }
  .pkg-list.active { display: block; }
  .pkg-grid.active { display: grid; }
  .pkg-grid:not(.active) { display: none; }

  .list-section { margin-bottom: 2rem; }

  .list-section-title {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    padding: 0 0 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }

  .list-row {
    display: grid;
    grid-template-columns: 200px 1fr 140px 80px;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.1s;
  }

  .list-row:hover { background: rgba(255,255,255,0.02); margin: 0 -8px; padding: 10px 8px; border-radius: 4px; }

  .list-name {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
  }

  .list-name:hover { color: var(--accent); }

  .list-desc {
    font-size: 12px;
    color: var(--muted);
  }

  .list-cat { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }

  .list-link {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.12s;
    justify-content: flex-end;
  }

  .list-link:hover { color: var(--accent); }

  /* Section headers */
  .section-divider {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin: 2rem 0 1rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    display: none;
  }
</style>
</head>

document.querySelector('.stat:nth-child(2) .stat-num').textContent = formulaeCount;
document.querySelector('.stat:nth-child(3) .stat-num').textContent = casksCount;
document.querySelector('#formulaeStat').textContent = 'formulae';
document.querySelector('#casksStat').textContent = 'casks';

function buildCats(){
  const bar = document.getElementById('catBar');
  bar.innerHTML = ['All',...cats].map(c=>`
    <button class="cat-btn${activeCat===c?' active':''}" onclick="setCat('${c}')">${c}</button>
  `).join('');
}

function setCat(c){ activeCat=c; buildCats(); render(); }
function setView(v){
  viewMode=v;
  document.getElementById('gridBtn').classList.toggle('active', v==='grid');
  document.getElementById('listBtn').classList.toggle('active', v==='list');
  render();
}

function ghIcon(){
  return `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>`;
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = packages.filter(p=>{
    const matchCat = activeCat==='All'||p.c===activeCat;
    const matchQ = !q||p.n.toLowerCase().includes(q)||p.d.toLowerCase().includes(q)||p.c.toLowerCase().includes(q);
    return matchCat&&matchQ;
  });

  document.getElementById('resultCount').textContent = filtered.length + ' packages';

  const empty = document.getElementById('empty');
  empty.style.display = filtered.length===0 ? 'block' : 'none';

  if(viewMode==='grid'){
    document.getElementById('gridView').classList.add('active');
    document.getElementById('listView').classList.remove('active');
    renderGrid(filtered);
  } else {
    document.getElementById('gridView').classList.remove('active');
    document.getElementById('listView').classList.add('active');
    renderList(filtered);
  }
}

function renderGrid(items){
  const grid = document.getElementById('gridView');
  grid.innerHTML = items.map(p=>{
    const col = catColors[p.c]||'#6b6b72';
    return `
      <div class="pkg-card">
        <div class="pkg-card-top">
          <a class="pkg-name" href="${p.gh}" target="_blank">${p.n}</a>
          <a class="pkg-link" href="${p.gh}" target="_blank" title="GitHub">${ghIcon()}</a>
        </div>
        <div class="pkg-desc">${p.d}</div>
        <div class="pkg-footer">
          <span class="cat-tag" style="color:${col};border-color:${col}22;background:${col}11">${p.c}</span>
          <span class="type-badge">${p.t}</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderList(items){
  const list = document.getElementById('listView');
  const byCat = {};
  items.forEach(p=>{ if(!byCat[p.c]) byCat[p.c]=[]; byCat[p.c].push(p); });
  list.innerHTML = Object.entries(byCat).sort((a,b)=>a[0].localeCompare(b[0])).map(([cat, pkgs])=>`
    <div class="list-section">
      <div class="list-section-title">${cat} <span style="opacity:0.5">(${pkgs.length})</span></div>
      ${pkgs.map(p=>`
        <div class="list-row">
          <a class="list-name" href="${p.gh}" target="_blank">${p.n}</a>
          <span class="list-desc">${p.d}</span>
          <span class="list-cat">${p.c}</span>
          <a class="list-link" href="${p.gh}" target="_blank">${ghIcon()} github</a>
        </div>
      `).join('')}
    </div>
  `).join('');
}

buildCats();
render();
</script>
</body>
</html>
